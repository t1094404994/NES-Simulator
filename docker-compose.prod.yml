services:
  server:
    restart: unless-stopped
    environment:
      CORS_ORIGIN: https://www.nes-simulator.com,https://nes-simulator.com

  web:
    restart: unless-stopped
    build:
      args:
        NEXT_PUBLIC_API_BASE: https://www.nes-simulator.com

  admin:
    restart: unless-stopped

  nginx:
    build:
      context: ./deploy/nginx
    image: nes-simulator-nginx
    network_mode: host
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped
