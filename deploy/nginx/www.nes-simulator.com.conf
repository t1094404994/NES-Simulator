upstream nes_web {
    server 127.0.0.1:3000;
}

upstream nes_api {
    server 127.0.0.1:8787;
}

# 别的机器上的服务只在这里加转发，不要在宿主机另开端口。
# upstream other_service {
#     server 10.0.0.2:8080;
# }

server {
    listen 80;
    server_name www.nes-simulator.com nes-simulator.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.nes-simulator.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nes-simulator.com;

    ssl_certificate /etc/letsencrypt/live/www.nes-simulator.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.nes-simulator.com/privkey.pem;

    return 301 https://www.nes-simulator.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.nes-simulator.com;

    ssl_certificate /etc/letsencrypt/live/www.nes-simulator.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.nes-simulator.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://nes_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # location /other/ {
    #     proxy_pass http://other_service;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://nes_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
